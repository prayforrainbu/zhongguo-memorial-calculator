
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百日對年計算器｜中國生命禮儀</title>

<style>
:root {
  --brown: #522305;
  --gold: #DBB966;
  --cream: #F8F5EF;
  --white: #FFFFFF;
  --muted: #967B5B;
  --line: #DED4C3;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--cream);
  color: var(--brown);
  font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  line-height: 1.6;
}

header {
  background: var(--white);
  border-bottom: 2px solid var(--gold);
}

.header-inner {
  max-width: 1200px;
  margin: auto;
  padding: 16px 24px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  width: fit-content;
}

.brand-logo {
  width: 62px;
  height: auto;
  display: block;
}

.brand-text {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.brand-chinese {
  width: 205px;
  height: auto;
}

.brand-english {
  width: 205px;
  height: auto;
}

main {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}

.page-title {
  text-align: center;
  margin-bottom: 30px;
}

h1 {
  font-size: 30px;
  letter-spacing: 3px;
  margin: 0 0 8px;
}

.subtitle {
  font-size: 14px;
  color: var(--muted);
  margin: 0;
}

.panel {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: 0 4px 16px rgba(82,35,5,.04);
}

.field-label {
  display: block;
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 12px;
}

.date-grid {
  display: grid;
  grid-template-columns: 1.3fr 1fr 1fr;
  gap: 12px;
}

select {
  width: 100%;
  height: 48px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: #FFFFFF;
  color: var(--brown);
  font: inherit;
  cursor: pointer;
}

select:focus-visible,
button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

.weekday {
  text-align: right;
  color: var(--muted);
  font-size: 14px;
  margin-top: 10px;
}

.saturday {
  color: #35639A;
}

.sunday {
  color: #B64A42;
}

.divider {
  border: 0;
  border-top: 1px solid var(--line);
  margin: 22px 0;
}

.custom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
}

.grand-options {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.grand-options label {
  position: relative;
  cursor: pointer;
}

.grand-options input {
  position: absolute;
  opacity: 0;
  width: 1px;
  height: 1px;
}

.grand-options span {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 48px;
  border: 1px solid var(--line);
  border-radius: 6px;
  white-space: nowrap;
  transition: .15s;
}

.grand-options span::before {
  content: "";
  width: 14px;
  height: 14px;
  border: 1px solid var(--muted);
  border-radius: 50%;
  background: white;
}

.grand-options input:checked + span {
  background: #F3E8D1;
  border-color: #B48C43;
  font-weight: bold;
}

.grand-options input:checked + span::before {
  background: var(--brown);
  box-shadow: inset 0 0 0 3px #FFFFFF;
  border-color: var(--brown);
}

.grand-options input:focus-visible + span {
  outline: 2px solid var(--gold);
  outline-offset: 3px;
}

button {
  font: inherit;
  cursor: pointer;
  border-radius: 6px;
}

.calculate-btn {
  width: 100%;
  height: 52px;
  margin-top: 28px;
  background: var(--brown);
  border: none;
  color: white;
  font-weight: bold;
  letter-spacing: 4px;
}

.calculate-btn:hover {
  background: #713D1B;
}

.result-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.result-card {
  border: 1px solid var(--gold);
  border-radius: 10px;
  background: var(--white);
  overflow: hidden;
}

.result-heading {
  background: #EFE4CE;
  padding: 14px;
  margin: 0;
  text-align: center;
  font-size: 20px;
  letter-spacing: 2px;
}

.result-content {
  padding: 22px;
}

.result-label {
  font-size: 14px;
  color: var(--muted);
  margin-bottom: 6px;
}

.result-date {
  background: #F8F6F2;
  border-radius: 6px;
  padding: 14px 12px;
  font-size: 19px;
  font-weight: bold;
  margin-bottom: 18px;
}

.result-note {
  font-size: 13px;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 12px;
}

.action-row {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 24px;
}

.secondary-btn {
  background: var(--white);
  color: var(--brown);
  border: 1px solid #BBA17B;
  padding: 10px 24px;
}

.secondary-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.status {
  text-align: center;
  font-size: 14px;
  color: var(--muted);
  margin: 14px 0 0;
}

footer {
  padding: 20px;
  text-align: center;
  font-size: 12px;
  color: var(--muted);
}

@media (max-width: 600px) {
  .header-inner {
    padding: 12px 16px;
  }

  .brand-logo {
    width: 48px;
  }

  .brand-chinese,
  .brand-english {
    width: 165px;
  }

  main {
    margin: 26px auto;
    padding: 0 14px;
  }

  h1 {
    font-size: 24px;
    letter-spacing: 1px;
  }

  .panel {
    padding: 18px;
  }

  .date-grid {
    gap: 6px;
  }

  select {
    padding: 0 6px;
    font-size: 16px;
  }

  .custom-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }

  .result-grid {
    grid-template-columns: 1fr;
    gap: 16px;
  }

  .action-row button {
    flex: 1;
    padding: 10px;
  }
}

@media print {
  body {
    background: white;
  }

  .calculate-btn,
  .action-row,
  .status {
    display: none;
  }

  main {
    margin: 20px auto;
  }

  .panel,
  .result-card {
    box-shadow: none;
    break-inside: avoid;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <img class="brand-logo"
           src="brand-logo.png"
           alt="中國生命禮儀 LOGO">

      <div class="brand-text">
        <img class="brand-chinese"
             src="brand-chinese.png"
             alt="中國生命禮儀">

        <img class="brand-english"
             src="brand-english.png"
             alt="公司英文名稱">
      </div>
    </div>
  </div>
</header>

<main>

  <section class="page-title">
    <h1>百日・對年計算器</h1>
    <p class="subtitle">
      請輸入往生日期及相關禮俗條件
    </p>
  </section>

  <section class="panel">

    <label class="field-label" for="year">
      往生日期（國曆）
    </label>

    <div class="date-grid">
      <select id="year" aria-label="民國年"></select>
      <select id="month" aria-label="月份"></select>
      <select id="day" aria-label="日期"></select>
    </div>

    <div id="weekday" class="weekday"></div>

    <hr class="divider">

    <div class="custom-grid">

      <div>
        <label class="field-label" for="sons">
          兒子人數
        </label>
        <select id="sons"></select>
      </div>

      <div>
        <div class="field-label">是否有大孫</div>

        <div class="grand-options"
             role="group"
             aria-label="是否有大孫">

          <label>
            <input type="radio"
                   name="grandson"
                   value="1">
            <span>有</span>
          </label>

          <label>
            <input type="radio"
                   name="grandson"
                   value="0"
                   checked>
            <span>無</span>
          </label>

        </div>
      </div>

    </div>

    <button class="calculate-btn"
            id="calculate"
            type="button">
      開始計算
    </button>

    <p id="status"
       class="status"
       role="status"
       aria-live="polite"></p>

  </section>

  <section class="result-grid">

    <article class="result-card">
      <h2 class="result-heading">百日日期</h2>

      <div class="result-content">
        <div class="result-label">國曆日期</div>
        <div class="result-date" id="hundred-solar">
          尚未計算
        </div>

        <div class="result-label">農曆日期</div>
        <div class="result-date" id="hundred-lunar">
          尚未計算
        </div>

        <div class="result-note" id="hundred-note">
          禮俗扣除天數：— 天
        </div>
      </div>
    </article>

    <article class="result-card">
      <h2 class="result-heading">對年日期</h2>

      <div class="result-content">
        <div class="result-label">國曆日期</div>
        <div class="result-date" id="year-solar">
          尚未計算
        </div>

        <div class="result-label">農曆日期</div>
        <div class="result-date" id="year-lunar">
          尚未計算
        </div>

        <div class="result-note" id="year-note">
          禮俗扣除天數：— 天
        </div>
      </div>
    </article>

  </section>

  <div class="action-row">
    <button class="secondary-btn"
            id="copy"
            disabled>
      複製結果
    </button>

    <button class="secondary-btn"
            id="reset">
      重新輸入
    </button>

    <button class="secondary-btn"
            id="print"
            disabled>
      列印結果
    </button>
  </div>

</main>

<footer>
  祭祀日期請依實際禮俗及家屬安排確認。
</footer>

<script>
const year = document.getElementById("year");
const month = document.getElementById("month");
const day = document.getElementById("day");
const sons = document.getElementById("sons");
const weekday = document.getElementById("weekday");
const status = document.getElementById("status");

const weekNames = [
  "星期日", "星期一", "星期二",
  "星期三", "星期四", "星期五", "星期六"
];

function taiwanToday() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Taipei",
    year: "numeric",
    month: "numeric",
    day: "numeric"
  }).formatToParts(new Date());

  const get = type =>
    Number(parts.find(p => p.type === type).value);

  return {
    year: get("year"),
    month: get("month"),
    day: get("day")
  };
}

function addOption(element, value, text) {
  const option = document.createElement("option");
  option.value = value;
  option.textContent = text;
  element.appendChild(option);
}

function initOptions() {
  const today = taiwanToday();
  const currentROC = today.year - 1911;

  for (let y = currentROC + 10; y >= 1; y--) {
    addOption(year, y, "民國 " + y + " 年");
  }

  for (let m = 1; m <= 12; m++) {
    addOption(month, m, m + " 月");
  }

  for (let s = 0; s <= 30; s++) {
    addOption(sons, s, s + " 位");
  }
}

function updateDays(preferredDay) {
  const selectedDay = preferredDay ??
    (Number(day.value) || 1);

  const westernYear = Number(year.value) + 1911;
  const selectedMonth = Number(month.value);

  const maxDay = new Date(
    westernYear,
    selectedMonth,
    0
  ).getDate();

  day.innerHTML = "";

  for (let d = 1; d <= maxDay; d++) {
    addOption(day, d, d + " 日");
  }

  day.value = Math.min(selectedDay, maxDay);

  updateWeekday();
}

function updateWeekday() {
  const date = new Date(
    Number(year.value) + 1911,
    Number(month.value) - 1,
    Number(day.value),
    12
  );

  const w = date.getDay();

  weekday.textContent = weekNames[w];
  weekday.className = "weekday";

  if (w === 6) {
    weekday.classList.add("saturday");
  }

  if (w === 0) {
    weekday.classList.add("sunday");
  }

  status.textContent = "";
}

function resetForm() {
  const today = taiwanToday();

  year.value = today.year - 1911;
  month.value = today.month;

  updateDays(today.day);

  sons.value = "0";

  document.querySelector(
    'input[name="grandson"][value="0"]'
  ).checked = true;

  [
    "hundred-solar",
    "hundred-lunar",
    "year-solar",
    "year-lunar"
  ].forEach(id => {
    document.getElementById(id).textContent =
      "尚未計算";
  });

  document.getElementById("hundred-note").textContent =
    "禮俗扣除天數：— 天";

  document.getElementById("year-note").textContent =
    "禮俗扣除天數：— 天";

  status.textContent = "";
}

year.addEventListener("change", () => updateDays());
month.addEventListener("change", () => updateDays());
day.addEventListener("change", updateWeekday);

sons.addEventListener("change", () => {
  status.textContent = "";
});

document.querySelectorAll(
  'input[name="grandson"]'
).forEach(input => {
  input.addEventListener("change", () => {
    status.textContent = "";
  });
});

document.getElementById("reset")
  .addEventListener("click", resetForm);

document.getElementById("calculate")
  .addEventListener("click", () => {
    status.textContent =
      "版面測試正常，祭祀日期計算功能將於下一階段加入。";
  });

initOptions();
resetForm();
</script>

</body>
</html>
