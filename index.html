<!DOCTYPE html>
<html lang="zh-Hant">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>百日對年計算器｜中國生命禮儀</title>
<style>
:root{--brown:#522305;--gold:#DBB966;--cream:#F8F5EF;--muted:#967B5B;--line:#DED4C3}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--brown);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.6}header{background:white;border-bottom:2px solid var(--gold)}.header-inner{max-width:1200px;margin:auto;padding:16px 24px}.brand{display:flex;align-items:center;gap:12px;width:fit-content}.brand-logo{width:62px;height:auto}.brand-text{display:flex;flex-direction:column;gap:6px}.brand-text img{width:205px;height:auto}main{max-width:900px;margin:40px auto;padding:0 20px}.page-title{text-align:center;margin-bottom:30px}h1{font-size:30px;letter-spacing:3px;margin:0 0 8px}.subtitle,footer,.status{color:var(--muted);font-size:14px}.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:28px;margin-bottom:24px;box-shadow:0 4px 16px #5223050a}.field-label{display:block;font-weight:bold;margin-bottom:12px}.date-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}select{width:100%;height:48px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:white;color:var(--brown);font:inherit}select:focus-visible,button:focus-visible,.grand-options input:focus-visible+span{outline:2px solid var(--gold);outline-offset:3px}.date-summary{text-align:right;font-size:14px;margin-top:10px;color:var(--muted)}.saturday{color:#35639A}.sunday{color:#B64A42}.divider{border:0;border-top:1px solid var(--line);margin:22px 0}.custom-grid,.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.grand-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grand-options label{position:relative;cursor:pointer}.grand-options input{position:absolute;opacity:0;width:1px;height:1px}.grand-options span{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border:1px solid var(--line);border-radius:6px}.grand-options span:before{content:"";width:14px;height:14px;border:1px solid var(--muted);border-radius:50%;background:white}.grand-options input:checked+span{background:#F3E8D1;border-color:#B48C43;font-weight:bold}.grand-options input:checked+span:before{background:var(--brown);box-shadow:inset 0 0 0 3px white}button{font:inherit;cursor:pointer;border-radius:6px}.calculate-btn{width:100%;height:52px;margin-top:28px;background:var(--brown);border:0;color:white;font-weight:bold;letter-spacing:4px}.result-grid{gap:20px}.result-card{border:1px solid var(--gold);border-radius:10px;background:white;overflow:hidden}.result-heading{background:#EFE4CE;padding:14px;margin:0;text-align:center;font-size:20px;letter-spacing:2px}.result-content{padding:22px}.result-label{font-size:14px;color:var(--muted);margin-bottom:6px}.result-date{background:#F8F6F2;border-radius:6px;padding:14px 12px;font-size:19px;font-weight:bold;margin-bottom:18px}.result-note{font-size:14px;color:#80551E;border-top:1px solid var(--line);padding-top:12px}.warning{background:#FBF2DD;border-radius:6px;padding:10px 12px;margin-top:10px;font-size:14px;color:#80551E}.warning[hidden]{display:none}.action-row{display:flex;justify-content:center;gap:12px;margin-top:24px}.secondary-btn{background:white;color:var(--brown);border:1px solid #BBA17B;padding:10px 24px}.secondary-btn:disabled{opacity:.5;cursor:not-allowed}.status{text-align:center;margin:14px 0 0}footer{text-align:center;padding:20px;font-size:12px}.print-summary{display:none}@media(max-width:600px){.header-inner{padding:12px 16px}.brand-logo{width:48px}.brand-text img{width:165px}main{margin:26px auto;padding:0 14px}h1{font-size:24px;letter-spacing:1px}.panel{padding:18px}.date-grid{gap:6px}select{padding:0 6px;font-size:16px}.custom-grid,.result-grid{grid-template-columns:1fr;gap:16px}.action-row button{flex:1;padding:10px}.result-content{padding:18px}}@media print{body{background:white}.panel,.action-row{display:none}.print-summary{display:block;margin-bottom:20px}.result-card{break-inside:avoid}main{margin:20px auto}.result-grid{grid-template-columns:1fr 1fr}*{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style></head><body>
<header><div class="header-inner"><div class="brand"><img class="brand-logo" src="brand-logo.png" alt="中國生命禮儀 LOGO"><div class="brand-text"><img src="brand-chinese.png" alt="中國生命禮儀"><img src="brand-english.png" alt="公司英文名稱"></div></div></div></header>
<main><section class="page-title"><h1>百日・對年計算器</h1><p class="subtitle">請輸入往生日期及相關禮俗條件</p></section>
<section class="panel"><label class="field-label" for="year">往生日期（國曆）</label><div class="date-grid"><select id="year" aria-label="民國年"></select><select id="month" aria-label="月份"></select><select id="day" aria-label="日期"></select></div><div class="date-summary" id="date-summary"></div><hr class="divider"><div class="custom-grid"><div><label class="field-label" for="sons">兒子人數</label><select id="sons"></select></div><div><div class="field-label">是否有大孫</div><div class="grand-options" role="group" aria-label="是否有大孫"><label><input type="radio" name="grandson" value="1"><span>有</span></label><label><input type="radio" name="grandson" value="0" checked><span>無</span></label></div></div></div><button class="calculate-btn" id="calculate">開始計算</button><p class="status" id="status" role="status" aria-live="polite"></p></section>
<div class="print-summary" id="print-summary"></div>
<section class="result-grid" aria-live="polite"><article class="result-card"><h2 class="result-heading">百日日期</h2><div class="result-content"><div class="result-label">國曆日期</div><div class="result-date" id="hundred-solar">尚未計算</div><div class="result-label">農曆日期</div><div class="result-date" id="hundred-lunar">尚未計算</div><div class="result-note" id="hundred-note">—</div></div></article><article class="result-card"><h2 class="result-heading">對年日期</h2><div class="result-content"><div class="result-label">國曆日期</div><div class="result-date" id="year-solar">尚未計算</div><div class="result-label">農曆日期</div><div class="result-date" id="year-lunar">尚未計算</div><div class="result-note" id="year-note">—</div><div class="warning" id="year-warning" hidden></div></div></article></section>
<div class="action-row"><button class="secondary-btn" id="copy" disabled>複製結果</button><button class="secondary-btn" id="reset">重新輸入</button><button class="secondary-btn" id="print" disabled>列印結果</button></div></main><footer>祭祀日期請依實際禮俗及家屬安排確認。<br>農曆資料：中央氣象署天文日曆；往生日期支援112年1月22日至118年12月31日。</footer>
<script>
'use strict';
const $=id=>document.getElementById(id), DAY=86400000;
const weeks=['日','一','二','三','四','五','六'];
const months=['正','二','三','四','五','六','七','八','九','十','十一','十二'];
const days=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
// 中央氣象署天文日曆：農曆各月初一表（2023–2030，2031正月作結束界線）
const calendarRows = [[2023,1,22,2023,1,false],[2023,2,20,2023,2,false],[2023,3,22,2023,2,true],[2023,4,20,2023,3,false],[2023,5,19,2023,4,false],[2023,6,18,2023,5,false],[2023,7,18,2023,6,false],[2023,8,16,2023,7,false],[2023,9,15,2023,8,false],[2023,10,15,2023,9,false],[2023,11,13,2023,10,false],[2023,12,13,2023,11,false],[2024,1,11,2023,12,false],[2024,2,10,2024,1,false],[2024,3,10,2024,2,false],[2024,4,9,2024,3,false],[2024,5,8,2024,4,false],[2024,6,6,2024,5,false],[2024,7,6,2024,6,false],[2024,8,4,2024,7,false],[2024,9,3,2024,8,false],[2024,10,3,2024,9,false],[2024,11,1,2024,10,false],[2024,12,1,2024,11,false],[2024,12,31,2024,12,false],[2025,1,29,2025,1,false],[2025,2,28,2025,2,false],[2025,3,29,2025,3,false],[2025,4,28,2025,4,false],[2025,5,27,2025,5,false],[2025,6,25,2025,6,false],[2025,7,25,2025,6,true],[2025,8,23,2025,7,false],[2025,9,22,2025,8,false],[2025,10,21,2025,9,false],[2025,11,20,2025,10,false],[2025,12,20,2025,11,false],[2026,1,19,2025,12,false],[2026,2,17,2026,1,false],[2026,3,19,2026,2,false],[2026,4,17,2026,3,false],[2026,5,17,2026,4,false],[2026,6,15,2026,5,false],[2026,7,14,2026,6,false],[2026,8,13,2026,7,false],[2026,9,11,2026,8,false],[2026,10,10,2026,9,false],[2026,11,9,2026,10,false],[2026,12,9,2026,11,false],[2027,1,8,2026,12,false],[2027,2,6,2027,1,false],[2027,3,8,2027,2,false],[2027,4,7,2027,3,false],[2027,5,6,2027,4,false],[2027,6,5,2027,5,false],[2027,7,4,2027,6,false],[2027,8,2,2027,7,false],[2027,9,1,2027,8,false],[2027,9,30,2027,9,false],[2027,10,29,2027,10,false],[2027,11,28,2027,11,false],[2027,12,28,2027,12,false],[2028,1,26,2028,1,false],[2028,2,25,2028,2,false],[2028,3,26,2028,3,false],[2028,4,25,2028,4,false],[2028,5,24,2028,5,false],[2028,6,23,2028,5,true],[2028,7,22,2028,6,false],[2028,8,20,2028,7,false],[2028,9,19,2028,8,false],[2028,10,18,2028,9,false],[2028,11,16,2028,10,false],[2028,12,16,2028,11,false],[2029,1,15,2028,12,false],[2029,2,13,2029,1,false],[2029,3,15,2029,2,false],[2029,4,14,2029,3,false],[2029,5,13,2029,4,false],[2029,6,12,2029,5,false],[2029,7,11,2029,6,false],[2029,8,10,2029,7,false],[2029,9,8,2029,8,false],[2029,10,8,2029,9,false],[2029,11,6,2029,10,false],[2029,12,5,2029,11,false],[2030,1,4,2029,12,false],[2030,2,3,2030,1,false],[2030,3,4,2030,2,false],[2030,4,3,2030,3,false],[2030,5,2,2030,4,false],[2030,6,1,2030,5,false],[2030,7,1,2030,6,false],[2030,7,30,2030,7,false],[2030,8,29,2030,8,false],[2030,9,27,2030,9,false],[2030,10,27,2030,10,false],[2030,11,25,2030,11,false],[2030,12,25,2030,12,false],[2031,1,23,2031,1,false]];
const calendar = calendarRows.map(([gy,gm,gd,y,m,leap])=>({t:stamp(gy,gm,gd),y,m,leap}));
function lunar(t){let lo=0,hi=calendar.length-1;if(t<calendar[0].t||t>=calendar[hi].t)throw Error('超出已核對農曆資料範圍');while(lo+1<hi){const mid=(lo+hi)>>1;if(calendar[mid].t<=t)lo=mid;else hi=mid;}const a=calendar[lo];return {y:a.y,m:a.m,leap:a.leap,d:Math.floor((t-a.t)/DAY)+1};}
function stamp(y,m,d){return Date.UTC(y,m-1,d,4)}
function solarText(t){const d=new Date(t);return `民國${d.getUTCFullYear()-1911}年${d.getUTCMonth()+1}月${d.getUTCDate()}日（星期${weeks[d.getUTCDay()]}）`;}
function lunarText(t){const l=lunar(t);return `民國${l.y-1911}年${l.leap?'閏':''}${months[l.m-1]}月${days[l.d-1]}日`;}
function anniversary(t){
 const birth=lunar(t), targetYear=birth.y+1;let start=null;
 for(let x=t+DAY;x<=t+450*DAY;x+=DAY){const l=lunar(x);if(l.y===targetYear&&l.m===birth.m&&!l.leap&&l.d===1){start=x;break;}}
 if(start===null)throw Error('找不到對年農曆月份');
 function length(s){for(let i=29;i<=30;i++)if(lunar(s+i*DAY).d===1)return i;throw Error('農曆月份長度異常');}
 const nominal=start+(Math.min(birth.d,length(start))-1)*DAY;
 const leapYears=new Set();
 // 閏月往生時，起始閏月不再重複計入；其後新進入的閏月才計入。
 for(let x=t+DAY;x<=nominal;x+=DAY){const l=lunar(x);if(l.leap&&l.d===1)leapYears.add(l.y);}
 const warnings=[];
 if(leapYears.size){const prev=lunar(start-DAY);start-=prev.d*DAY;warnings.push([...leapYears].map(y=>'民國'+(y-1911)+'年').join('、')+'遇閏月，提前一個月祭拜。');}
 const n=length(start);if(birth.d>n)warnings.push('因隔年無農曆三十日，所以提前一天。');
 if(birth.leap)warnings.push('往生日期為農曆閏月，依隔年正常月份為基準計算。');
 return {t:start+(Math.min(birth.d,n)-1)*DAY,warnings};
}
let result=null;
function option(el,v,label){el.add(new Option(label,v));}
function today(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'numeric',day:'numeric'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return {y:+p.year,m:+p.month,d:+p.day};}
function selected(){return stamp(+$('year').value+1911,+$('month').value,+$('day').value);}
function clearResult(){result=null;for(const id of ['hundred-solar','hundred-lunar','year-solar','year-lunar']){$(id).textContent='尚未計算';$(id).className='result-date';}for(const id of ['hundred-note','year-note'])$(id).textContent='—';$('year-warning').hidden=true;$('year-warning').textContent='';$('print-summary').textContent='';$('copy').disabled=$('print').disabled=true;$('status').textContent='';}
function colorDate(el,t){el.classList.remove('saturday','sunday');const w=new Date(t).getUTCDay();if(w===6)el.classList.add('saturday');if(w===0)el.classList.add('sunday');}
function updateDate(){clearResult();const t=selected();try{$('date-summary').textContent=solarText(t)+'｜農曆 '+lunarText(t);colorDate($('date-summary'),t);}catch(e){$('date-summary').textContent='農曆資料範圍：112年1月22日起，請選擇支援日期。';}}
function updateDays(preferred){const d=preferred??(+$('day').value||1);const max=new Date(Date.UTC(+$('year').value+1911,+$('month').value,0)).getUTCDate();$('day').replaceChildren();for(let i=1;i<=max;i++)option($('day'),i,i+' 日');$('day').value=Math.min(d,max);updateDate();}
function reset(){const now=today();$('year').value=Math.max(112,Math.min(118,now.y-1911));$('month').value=now.m;$('sons').value=0;document.querySelector('input[name="grandson"][value="0"]').checked=true;updateDays(now.d);}
function calculate(){clearResult();try{const death=selected(),sons=+$('sons').value,g=+document.querySelector('input[name="grandson"]:checked').value,n=100-sons-g,h=death+(n-1)*DAY,a=anniversary(death);const note=`兒子${sons}位、大孫${g?'有':'無'}，第${n}天百日`;const ynote='依往生農曆日期加一年計算';const values=[['hundred',h],['year',a.t]];for(const [id,t] of values){$(id+'-solar').textContent=solarText(t);colorDate($(id+'-solar'),t);$(id+'-lunar').textContent=lunarText(t);}
 $('hundred-note').textContent=note;$('year-note').textContent=ynote;for(const msg of a.warnings){const div=document.createElement('div');div.textContent=msg;$('year-warning').append(div);}$('year-warning').hidden=!a.warnings.length;
 $('print-summary').textContent='往生日期：'+solarText(death)+'｜農曆 '+lunarText(death);
 result=['中國生命禮儀｜百日對年日期','【往生日期】','國曆：'+solarText(death),'農曆：'+lunarText(death),'','【百日日期】','國曆：'+solarText(h),'農曆：'+lunarText(h),note,'','【對年日期】','國曆：'+solarText(a.t),'農曆：'+lunarText(a.t),...a.warnings,'','祭祀日期請依實際禮俗及家屬安排確認。'].join('\n');$('copy').disabled=$('print').disabled=false;$('status').textContent='計算完成，請確認日期。';}catch(e){clearResult();$('status').textContent='計算失敗：'+e.message+'。請人工確認日期。';}}
$('calculate').addEventListener('click',calculate);$('reset').addEventListener('click',reset);$('print').addEventListener('click',()=>{if(result)window.print()});$('copy').addEventListener('click',async()=>{if(!result)return;try{await navigator.clipboard.writeText(result);$('status').textContent='已複製結果，可貼至 LINE。';}catch(e){$('status').textContent='無法自動複製，請手動複製以下文字。';const area=document.createElement('textarea');area.value=result;area.readOnly=true;area.style.cssText='width:100%;min-height:220px;margin-top:12px';$('status').append(area);area.select();}});
for(const id of ['year','month'])$(id).addEventListener('change',()=>updateDays());$('day').addEventListener('change',updateDate);$('sons').addEventListener('change',clearResult);document.querySelectorAll('input[name="grandson"]').forEach(x=>x.addEventListener('change',clearResult));
for(let y=118;y>=112;y--)option($('year'),y,'民國 '+y+' 年');for(let m=1;m<=12;m++)option($('month'),m,m+' 月');for(let s=0;s<=30;s++)option($('sons'),s,s+' 位');reset();
</script></body></html>
